<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Text AI - Stable Green Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121814; 
            color: #e2ebd5; 
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background: #161f18;
            border-right: 1px solid #2d3f32;
            display: flex;
            flex-direction: column;
            padding: 15px;
            height: 100%;
            z-index: 10;
        }
        .new-chat-btn {
            background: #2e7d32;
            color: #ffffff;
            border: 1px solid #3d9e43;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
            text-align: center;
        }
        .new-chat-btn:hover { background: #3d9e43; }
        .history-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #74a381;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .chat-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-item {
            width: 100%;
            text-align: left;
            font: inherit;
            padding: 10px;
            background: #1d2920;
            border: 1px solid #2d3f32;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #cedbc0;
            transition: all 0.2s;
        }
        .chat-item:hover, .chat-item.active {
            background: #243628;
            border-color: #52b788;
            color: #ffffff;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .secondary-btn {
            background: #1d2920;
            color: #cedbc0;
            border: 1px solid #2d3f32;
            padding: 9px 10px;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
        }
        .secondary-btn:hover {
            background: #243628;
            border-color: #52b788;
            color: #ffffff;
        }
        .danger-btn:hover {
            border-color: #d66b6b;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .status { 
            font-size: 0.85em; 
            font-weight: bold; 
            padding: 8px 12px; 
            border-radius: 20px; 
            background: #233227; 
            color: #a3cfb0; 
            align-self: center; 
            margin-bottom: 15px; 
            text-align: center; 
            border: 1px solid #344a3a;
        }
        .chat-container { 
            background: #1a231c; 
            border: 1px solid #2d3f32;
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0, 255, 100, 0.05); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1;
            height: calc(100% - 60px);
        }
        .messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 10px; 
            border: 1px solid #2d3f32; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            background: #141b16; 
            display: flex;
            flex-direction: column;
        }
        .msg { 
            margin-bottom: 12px; 
            padding: 10px 14px; 
            border-radius: 8px; 
            max-width: 80%; 
            line-height: 1.4; 
            word-wrap: break-word; 
            white-space: pre-wrap; 
        }
        .user-msg { 
            background: #2e7d32; 
            color: #ffffff; 
            align-self: flex-end; 
            margin-left: auto; 
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.3);
        }
        .ai-msg { 
            background: #222d25; 
            color: #d1e7dd; 
            align-self: flex-start; 
            border: 1px solid #2d3e31;
        }
        .input-area { 
            display: flex; 
            gap: 10px; 
        }
        textarea { 
            flex-grow: 1; 
            border: 1px solid #2d3f32; 
            border-radius: 8px; 
            padding: 10px; 
            resize: none; 
            font-size: 1em; 
            height: 44px; 
            background: #141b16;
            color: #ffffff;
        }
        textarea:focus { 
            outline: none; 
            border-color: #52b788; 
            box-shadow: 0 0 5px rgba(82, 183, 136, 0.4);
        }
        button.send-btn { 
            background: #52b788; 
            color: #0b100c; 
            border: none; 
            padding: 0 24px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        button.send-btn:hover { 
            background: #74c69d; 
            box-shadow: 0 0 10px rgba(82, 183, 136, 0.6);
        }
        button:disabled { 
            background: #233227; 
            color: #536e5a;
            cursor: not-allowed; 
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button id="new-chat-btn" class="new-chat-btn" type="button">+ New Data Stream</button>
        <div class="history-label">Saved Cycles</div>
        <div id="chat-list-box" class="chat-list" aria-label="Saved chats"></div>
        <div class="sidebar-actions">
            <button id="clear-chat-btn" class="secondary-btn" type="button">Clear Current Chat</button>
            <button id="clear-all-btn" class="secondary-btn danger-btn" type="button">Delete All History</button>
        </div>
    </div>

    <div class="main-content">
        <div id="status" class="status">Loading framework protocols...</div>
        <div class="chat-container">
            <div id="messages-box" class="messages">
                <div class="msg ai-msg">System ready. Running fully client-side on your hardware. Enter data stream:</div>
            </div>
            <div class="input-area">
                <textarea id="user-input" placeholder="Transmit message..." aria-label="Message input"></textarea>
                <button id="send-btn" class="send-btn" type="button" disabled>Send</button>
            </div>
        </div>
    </div>

    <script type="module" src="./script.js"></script>
  <script type="module" src="./script.js"></script>
    <script type="module" src="./fallback-ai.js"></script> <!-- Add this line here -->
</body>
</html>
